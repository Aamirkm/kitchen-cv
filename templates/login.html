<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaal Counter - Login</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2c3e50; 
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            background-color: #34495e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin: 0 0 30px 0;
            color: #3498db;
            font-size: 2.2em;
        }
        .subtitle {
            color: #bdc3c7;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .form-group {
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #ecf0f1;
            font-size: 1.1em;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 1.5em;
            text-align: center;
            letter-spacing: 0.2em;
            border: 2px solid #7f8c8d;
            border-radius: 8px;
            background-color: #2c3e50;
            color: #ecf0f1;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 600;
        }
        .btn-login:hover {
            background-color: #229954;
        }
        .btn-login:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 1em;
            min-height: 20px;
        }
        .success-message {
            color: #27ae60;
            margin-top: 15px;
            font-size: 1em;
            min-height: 20px;
        }
        .loading {
            display: none;
            color: #3498db;
            margin-top: 15px;
        }
        .mosque-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #7f8c8d;
            color: #bdc3c7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Thaal Computer Vision Application</h1>
        <p class="subtitle">Enter 4-digit passcode</p>
        
        <form id="loginForm">
            <div class="form-group">
                <input 
                    type="password" 
                    id="passcode" 
                    name="passcode" 
                    maxlength="4" 
                    pattern="[0-9]{4}" 
                    placeholder="****"
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                Access System
            </button>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loadingMessage">Authenticating...</div>
        </form>
        
        <div class="mosque-info">
            <p>Made by Aamir Merchant</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const passcodeInput = document.getElementById('passcode');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingMessage = document.getElementById('loadingMessage');

        // Auto-focus on passcode input
        passcodeInput.focus();

        // Only allow numeric input
        passcodeInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Handle form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const passcode = passcodeInput.value;
            
            // Clear previous messages
            errorMessage.textContent = '';
            successMessage.textContent = '';
            
            // Validate passcode length
            if (passcode.length !== 4) {
                errorMessage.textContent = 'Please enter a 4-digit passcode';
                return;
            }
            
            // Show loading state
            loginBtn.disabled = true;
            loadingMessage.style.display = 'block';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ passcode: passcode })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    successMessage.textContent = 'Success! Redirecting...';
                    // Redirect to main page after successful login
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    errorMessage.textContent = data.message || 'Invalid passcode';
                    passcodeInput.value = '';
                    passcodeInput.focus();
                }
            } catch (error) {
                errorMessage.textContent = 'Connection error. Please try again.';
                console.error('Login error:', error);
            } finally {
                // Hide loading state
                loginBtn.disabled = false;
                loadingMessage.style.display = 'none';
            }
        });

        // Handle Enter key press
        passcodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
