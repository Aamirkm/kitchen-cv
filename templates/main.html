<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaal Counter Control</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: #2c3e50; 
            color: #ecf0f1;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 20px; }
        .video-container {
            margin-bottom: 20px;
        }
        img { 
            border: 3px solid #3498db; 
            border-radius: 8px; 
            background-color: #000;
            max-width: 960px; 
            width: 100%;      
            height: auto;     
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-start { background-color: #27ae60; }
        .btn-stop { background-color: #c0392b; }
        .btn-dashboard { background-color: #8e44ad; }
        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Thaal Counter Control Panel</h1>

    <div class="video-container">
        <img src="{{ url_for('video_feed') }}">
    </div>

    <div class="controls">
        <button id="start-btn" class="btn btn-start" onclick="startService()">Start Service</button>
        <button id="stop-btn" class="btn btn-stop" onclick="stopService()">Stop Service</button>
        <a href="/dashboard" class="btn btn-dashboard">View Dashboard</a>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');

        function sendCommand(endpoint, data = {}) {
            fetch(endpoint, { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data.status);
                updateStatus();
            })
            .catch(error => console.error('Error:', error));
        }

        function startService() {
            const expected = prompt("Optional: Enter the expected number of thaals for this service:", "");
            if (expected === null) {
                return;
            }
            if (expected.trim() !== "" && !/^\d+$/.test(expected)) {
                alert("Please enter a valid number for expected thaals.");
                return;
            }
            sendCommand('/start_service', { expected_thaals: expected });
        }

        function stopService() {
            if (confirm('Are you sure you want to stop the service? This will finalize the session and reset counts.')) {
                sendCommand('/stop_service');
            }
        }

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.service_active) {
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                    } else {
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                    }
                })
                .catch(error => console.error('Error fetching status:', error));
        }

        document.addEventListener('DOMContentLoaded', updateStatus);
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
