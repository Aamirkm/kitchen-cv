<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaal Counter Control</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: #2c3e50; 
            color: #ecf0f1;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 20px; }
        .video-container {
            margin-bottom: 20px;
        }
        img { 
            border: 3px solid #3498db; 
            border-radius: 8px; 
            background-color: #000;
            max-width: 960px; 
            width: 100%;      
            height: auto;     
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            text-decoration: none; /* For 'a' tags styled as buttons */
            display: inline-block;
        }
        .btn-start { background-color: #27ae60; }
        .btn-dashboard { background-color: #8e44ad; }
        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Thaal Counter Control Panel</h1>

    <div class="video-container">
        <img src="{{ url_for('video_feed') }}">
    </div>

    <div class="controls">
        <button id="start-btn" class="btn btn-start" onclick="startService()">Start Service</button>
        <a href="/dashboard" class="btn btn-dashboard">View Dashboard</a>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');

        function sendCommand(endpoint) {
            fetch(endpoint, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data.status);
                    updateStatus();
                })
                .catch(error => console.error('Error:', error));
        }

        function startService() { 
            // Optional: Ask for confirmation before starting a new service
            if (confirm('Are you sure you want to start a new service? This will reset any previous counts if the service was not stopped.')) {
                sendCommand('/start_service');
            }
        }

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    // If service is active, disable the start button.
                    // If it's inactive, enable it.
                    startBtn.disabled = data.service_active;
                })
                .catch(error => console.error('Error fetching status:', error));
        }

        // Initial status update when the page loads
        document.addEventListener('DOMContentLoaded', updateStatus);
        // Periodically update status every 5 seconds
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
