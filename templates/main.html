<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaal Counter Control</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: #2c3e50; 
            color: #ecf0f1;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 20px; }
        .video-container {
            max-width: 960px;
            margin: 0 auto 20px;
            background-color: #000;
            border-radius: 8px;
            border: 3px solid #3498db; 
            line-height: 0;
        }
        img { 
            max-width: 100%;
            width: 100%;      
            height: auto;
            display: block; 
            border-radius: 5px;
        }
        /* --- NEW: Metrics Section Styling --- */
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 960px;
            margin: 20px auto;
        }
        .metric-card {
            background-color: #34495e;
            padding: 20px;
            border-radius: 8px;
        }
        .metric-card h2 {
            margin: 0 0 10px;
            color: #bdc3c7;
            font-size: 1.1em;
        }
        .metric-card p {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            color: #3498db;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-start { background-color: #27ae60; }
        .btn-stop { background-color: #c0392b; }
        .btn-toggle-stream { background-color: #8e44ad; }
        .btn-dashboard { background-color: #d49734; }
        .btn-logout { background-color: #be3f31; }
        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Thaal Counter Control Panel</h1>

    <div class="video-container">
        <img id="video-stream" src="{{ url_for('video_feed') }}">
    </div>

    <!-- --- NEW: Live Metrics Section --- -->
    <div class="metrics">
        <div class="metric-card">
            <h2>Thaals Out</h2>
            <p id="live-thaal-out">0</p>
        </div>
        <div class="metric-card">
            <h2>Thaals In</h2>
            <p id="live-thaal-in">0</p>
        </div>
        <div class="metric-card">
            <h2>Registered Thaals</h2>
            <p id="live-expected">N/A</p>
        </div>
        <div class="metric-card">
            <h2>Service Time</h2>
            <p id="live-duration">0</p>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn" class="btn btn-start" onclick="startService()">Start Service</button>
        <button id="stop-btn" class="btn btn-stop" onclick="stopService()">Stop Service</button>
        <button id="toggle-stream-btn" class="btn btn-toggle-stream" onclick="toggleStream()">Hide Stream</button>
        <a href="/dashboard" class="btn btn-dashboard">View Dashboard</a>
        <a href="/logout" class="btn btn-logout">Logout</a>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const toggleStreamBtn = document.getElementById('toggle-stream-btn');
        const videoStream = document.getElementById('video-stream');
        const videoContainer = document.querySelector('.video-container');

        // --- NEW: Get references to the new metric elements ---
        const liveThaalOut = document.getElementById('live-thaal-out');
        const liveThaalIn = document.getElementById('live-thaal-in');
        const liveExpected = document.getElementById('live-expected');
        const liveDuration = document.getElementById('live-duration');

        let isStreamVisible = true;
        const videoFeedUrl = "{{ url_for('video_feed') }}";

        function sendCommand(endpoint, data = {}) {
            fetch(endpoint, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data.status);
                updateStatus();
            })
            .catch(error => console.error('Error:', error));
        }

        function startService() {
            const expected = prompt("Optional: Enter the registered number of thaals for this service:", "");
            if (expected === null) { return; }
            if (expected.trim() !== "" && !/^\d+$/.test(expected)) {
                alert("Please enter a valid number for registered thaals.");
                return;
            }
            sendCommand('/start_service', { expected_thaals: expected });
        }

        function stopService() {
            if (confirm('Are you sure you want to stop the service? This will reset the counts.')) {
                sendCommand('/stop_service');
            }
        }

        function toggleStream() {
            isStreamVisible = !isStreamVisible;
            if (isStreamVisible) {
                videoStream.src = videoFeedUrl;
                videoContainer.style.display = 'block';
                toggleStreamBtn.textContent = 'Hide Stream';
            } else {
                videoStream.src = '#';
                videoContainer.style.display = 'none';
                toggleStreamBtn.textContent = 'Show Stream';
            }
        }

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    // Update button states
                    if (data.service_active) {
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                    } else {
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                    }
                    
                    // --- NEW: Update the live metric cards ---
                    liveThaalOut.textContent = data.thaal_out;
                    liveThaalIn.textContent = data.thaal_in;
                    liveExpected.textContent = data.expected_thaals || 'N/A';
                    liveDuration.textContent = data.service_duration_minutes + ' mins';
                })
                .catch(error => console.error('Error fetching status:', error));
        }

        document.addEventListener('DOMContentLoaded', updateStatus);
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
