<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaal Counter Control</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: #2c3e50; 
            color: #ecf0f1;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 20px; }
        .video-container {
            /* --- FIX STARTS HERE --- */
            max-width: 960px;       /* Match the image's max-width */
            margin: 0 auto 20px;  /* Center the container horizontally and add bottom margin */
            /* --- END FIX --- */
            
            background-color: #000;
            border-radius: 8px;
            border: 3px solid #3498db; 
            line-height: 0; /* Prevents extra space below the image */
        }
        img { 
            max-width: 100%; /* Image should not exceed its container */
            width: 100%;      
            height: auto;
            display: block; 
            border-radius: 5px; /* Match container rounding */
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-start { background-color: #27ae60; }
        .btn-stop { background-color: #c0392b; }
        .btn-toggle-stream { background-color: #f39c12; }
        .btn-dashboard { background-color: #8e44ad; }
        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Thaal Counter Control Panel</h1>

    <div class="video-container">
        <!-- The video stream image tag -->
        <img id="video-stream" src="{{ url_for('video_feed') }}">
    </div>

    <div class="controls">
        <button id="start-btn" class="btn btn-start" onclick="startService()">Start Service</button>
        <button id="stop-btn" class="btn btn-stop" onclick="stopService()">Stop Service</button>
        <button id="toggle-stream-btn" class="btn btn-toggle-stream" onclick="toggleStream()">Hide Stream</button>
        <a href="/dashboard" class="btn btn-dashboard">View Dashboard</a>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const toggleStreamBtn = document.getElementById('toggle-stream-btn');
        const videoStream = document.getElementById('video-stream');
        const videoContainer = document.querySelector('.video-container');

        let isStreamVisible = true;
        const videoFeedUrl = "{{ url_for('video_feed') }}";

        function sendCommand(endpoint, data = {}) {
            fetch(endpoint, { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data.status);
                updateStatus();
            })
            .catch(error => console.error('Error:', error));
        }

        function startService() {
            const expected = prompt("Optional: Enter the expected number of thaals for this service:", "");
            if (expected === null) { return; }
            if (expected.trim() !== "" && !/^\d+$/.test(expected)) {
                alert("Please enter a valid number for expected thaals.");
                return;
            }
            sendCommand('/start_service', { expected_thaals: expected });
        }

        function stopService() {
            if (confirm('Are you sure you want to stop the service? This will reset the counts.')) {
                sendCommand('/stop_service');
            }
        }

        function toggleStream() {
            isStreamVisible = !isStreamVisible;
            if (isStreamVisible) {
                videoStream.src = videoFeedUrl;
                videoContainer.style.display = 'block'; // Show container
                toggleStreamBtn.textContent = 'Hide Stream';
            } else {
                videoStream.src = '#'; // This stops the browser from loading the stream
                videoContainer.style.display = 'none'; // Hide container
                toggleStreamBtn.textContent = 'Show Stream';
            }
        }

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.service_active) {
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                    } else {
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                    }
                })
                .catch(error => console.error('Error fetching status:', error));
        }

        document.addEventListener('DOMContentLoaded', updateStatus);
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
